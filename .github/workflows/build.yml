# Builds both add-on variants on every push and pull request. A tag vX.Y.Z (matching src/version.h) also publishes
# a GitHub release with dist/factorio-fg-X.Y.Z.zip and RELEASE_NOTES.md as its text.
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Developer build (hudless_probe.addon64)
        shell: cmd
        env:
          FG_NOPAUSE: "1"
        run: call build.bat

      - name: Release build and package (factorio_fg.addon64)
        shell: cmd
        env:
          FG_NOPAUSE: "1"
        run: call package_release.bat

      - uses: actions/upload-artifact@v4
        with:
          name: factorio-fg
          path: dist/*.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $zip = "dist/factorio-fg-$ver.zip"
          if (-not (Test-Path $zip)) { throw "$zip not found: the tag does not match ADDON_VERSION_STRING in src/version.h" }
          gh release create "${{ github.ref_name }}" $zip --title "Factorio frame generation $ver" --notes-file RELEASE_NOTES.md
